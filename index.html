<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="utf-8">
    <title>Metal</title>
    <style>
        body {
            background-color: #121212;
            color: #dddddd;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            margin: 30px;
        }

        h1 {
            color: darkred;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .podnadpis {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }
        .hlavny-obsah {
            width: 800px;
            margin: 0 auto;
            overflow: hidden;
        }

        .lavo {
            float: left;
            width: 450px;
        }

        .pravo {
            float: right;
            width: 300px;
            text-align: center;
        }

        .ramecek {
            border: 2px solid darkred;
            padding: 15px;
            text-align: left;
            background-color: #1a1a1a;
            margin-bottom: 15px;
        }

        .ramecek ul {
            margin: 0;
            padding-left: 20px;
        }

        img {
            max-width: 100%;
            height: auto;
            border: 2px solid darkred;
        }

        a {
            color: #ff4d4d;
        }
    </style>
</head>
<body>

    <h1>Metal</h1>
    <p class="podnadpis">Táto stránka je o metale</p>

    <div class="hlavny-obsah">
        <div class="lavo">
            <p>Túto tému som si vybral, lebo milujem metal.</p>

            <div class="ramecek">
                <h2>Čo bude na tejto stránke?</h2>
                <ul>
                    <li>Žánre</li>
                    <li>Najlepšie kapely zo žánrov/subžánrov</li>
                    <li>História metalu</li>
                </ul>
            </div>

            <p>Viac je na <a href="https://en.wikipedia.org/wiki/Heavy_metal_music" target="_blank">Wikipédii</a>.</p>
        </div>

        <div class="pravo">
            <img src="https://imgs.search.brave.com/Z6zTFCA9MD4BDmFjSF_PRwVWBIGYFHMc0F6ipkAqW6U/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93d3cu/bnVjbGVhcmJsYXN0/LmNvbS9jZG4vc2hv/cC9maWxlcy9JbW1v/cnRhbF8tX1dhcl9B/Z2FpbnN0X0FsbC5q/cGc_dj0xNzA3ODE5/Njk0JndpZHRoPTMz/MA" alt="obrázok kapely Immortal">
        </div>
    </div>

</body>
</html>
